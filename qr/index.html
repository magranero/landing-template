<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Déjanos tu reseña - Marisquería El Yate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px}
.card{background:#fff;border-radius:20px;padding:40px;text-align:center;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
h1{font-size:24px;color:#1f2937;margin-bottom:8px}
.stars{font-size:36px;margin:16px 0}
p{color:#6b7280;margin-bottom:24px;line-height:1.5}
.btn{display:inline-block;padding:16px 32px;background:#2563eb;color:#fff;text-decoration:none;border-radius:999px;font-weight:bold;font-size:16px}
.btn:hover{background:#1d4ed8}
.back{display:block;margin-top:20px;color:#6b7280;text-decoration:none;font-size:14px}
.back:hover{color:#1f2937}
</style>
</head>
<body>
<div class="card">
<h1>Marisquería El Yate</h1>
<div class="stars">⭐⭐⭐⭐⭐</div>
<p>Tu opinión nos ayuda a mejorar cada día. Déjanos tu reseña en Google y cuéntanos tu experiencia.</p>
<a href="https://search.google.com/local/writereview?placeid=" class="btn">Escribir reseña</a>
<a href="/" class="back">← Volver a la web</a>
</div>
</body>
</html>
